name: CI

on:
  push:
    branches: [main]
  pull_request:

# ClaudeDial needs Qt 6.8 (QStyleHints::setColorScheme), and no GitHub-hosted
# runner ships that in apt - ubuntu-24.04 is on Qt 6.4. So the build runs in
# containers instead, which also makes the toolchain explicit rather than
# whatever the runner image happens to have this month.
#
# Two of them on purpose: the newest Qt catches nothing on its own, and a
# container pinned near our declared floor is what stops a 6.9-only API from
# creeping in unnoticed.

jobs:
  # Windows is a supported target for personal use, and no contributor has a
  # cross compiler for it - so it is compiled here, on every push, rather than
  # discovered to be broken while cutting a release. The tests run too: the core
  # is plain Qt and there is no reason for them not to.
  windows:
    name: Windows (compile and test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      # Qt's deployment script, run through install, rather than a bare
      # windeployqt call - see the note in CMakeLists.txt for why.
      # An absolute prefix, and not by preference: Qt's deploy support composes
      # the qt.conf path from CMAKE_INSTALL_PREFIX and then refuses a relative
      # one - "Given qt.conf path is not an absolute path: 'dist/bin/qt.conf'".
      # A relative --prefix gets all the way through installing the QML modules
      # before failing, which makes it look like a deployment problem rather
      # than a path one.
      - name: Assemble the runtime
        shell: pwsh
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/dist"

      # Printed, not just asserted. There is no cross compiler for Windows on
      # any machine working on this, so a failure here is otherwise diagnosed by
      # guesswork - and one guess about this step has already been wrong.
      - name: Show what was assembled
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName | ForEach-Object { $_.Replace((Resolve-Path dist).Path, '') }

      # Searched recursively rather than at a fixed path: the layout is Qt's to
      # choose, and asserting a guessed one is how the previous attempt failed.
      - name: Check what was assembled
        shell: pwsh
        run: |
          $fail = 0
          function Need($pattern, $what) {
            if (-not (Get-ChildItem -Recurse -Path dist -Filter $pattern -ErrorAction SilentlyContinue)) {
              Write-Host "MISSING $what ($pattern)"
              return 1
            }
            return 0
          }
          $fail += Need 'claudedial.exe' 'the binary'
          $fail += Need 'Qt6Core.dll'    'the Qt runtime'
          $fail += Need 'Qt6Quick.dll'   'QtQuick'
          $fail += Need 'qwindows.dll'   'the windows platform plugin'
          if (-not (Get-ChildItem -Recurse -Path dist -Directory -Filter 'Basic' -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match 'Controls' })) {
            Write-Host 'MISSING QtQuick.Controls.Basic - the settings window will not load'
            $fail += 1
          }
          if (-not (Get-ChildItem -Recurse -Path dist -Filter 'qopensslbackend.dll' -ErrorAction SilentlyContinue) -and
              -not (Get-ChildItem -Recurse -Path dist -Filter 'qschannelbackend.dll' -ErrorAction SilentlyContinue)) {
            Write-Host 'MISSING a TLS backend - api.anthropic.com will be unreachable'
            $fail += 1
          }
          exit $fail

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ClaudeDial-windows-x86_64.zip

      # Attached to every run, so getting a Windows build is a download rather
      # than a manual workflow dispatch or a spent version number.
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeDial-windows-x86_64
          path: ClaudeDial-windows-x86_64.zip
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Arch (newest Qt)"
            container: archlinux:latest
            install: |
              pacman -Syu --noconfirm --needed \
                base-devel cmake ninja git \
                qt6-base qt6-declarative qt6-svg
          - name: "Fedora 41 (near the declared Qt floor)"
            container: fedora:41
            install: |
              dnf -y install \
                gcc-c++ cmake ninja-build git \
                qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
                mesa-libGL-devel

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: ${{ matrix.install }}

      - name: Report the Qt version actually in use
        run: cmake --version && (qmake6 -query QT_VERSION || true)

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The core is deliberately headless-testable: QTEST_GUILESS_MAIN, no
      # QGuiApplication, no display. If this ever needs Xvfb, something has
      # leaked out of core.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Catches the classic packaging failure: a file that builds here because
      # it exists locally but was never committed.
      - name: Install into a staging root
        run: DESTDIR="$PWD/staged" cmake --install build --prefix /usr

      - name: Show what would be packaged
        run: find staged -type f | sort

      # QML resolves properties at run time, so a token removed from Theme.qml
      # leaves a dangling reference that compiles, links, packages and ships.
      # Exactly that happened: theme.warning was removed when the colour ramp
      # moved into C++, Popup.qml kept referencing it, and the "Stale" label
      # rendered with no colour. A warm QML cache hid it locally; only a
      # packaged build with a cold cache showed the error.
      - name: Check every theme token referenced in QML exists
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          theme = pathlib.Path('src/ui/qml/Theme.qml').read_text()
          defined = set(re.findall(r'property (?:color|int|bool) (\w+)', theme)) | {'levelColor'}
          missing = {}
          for f in sorted(pathlib.Path('src/ui/qml').glob('*.qml')):
              if f.name == 'Theme.qml':
                  continue
              used = set(re.findall(r'\btheme\.(\w+)', f.read_text()))
              gap = used - defined
              if gap:
                  missing[f.name] = sorted(gap)
          for name, tokens in missing.items():
              print(f"{name}: references undefined theme tokens {tokens}")
          sys.exit(1 if missing else 0)
          EOF
