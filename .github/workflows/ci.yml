name: CI

on:
  push:
    branches: [main]
  pull_request:

# ClaudeDial needs Qt 6.8 (QStyleHints::setColorScheme), and no GitHub-hosted
# runner ships that in apt - ubuntu-24.04 is on Qt 6.4. So the build runs in
# containers instead, which also makes the toolchain explicit rather than
# whatever the runner image happens to have this month.
#
# Two of them on purpose: the newest Qt catches nothing on its own, and a
# container pinned near our declared floor is what stops a 6.9-only API from
# creeping in unnoticed.

jobs:
  # Windows is a supported target for personal use, and no contributor has a
  # cross compiler for it - so it is compiled here, on every push, rather than
  # discovered to be broken while cutting a release. The tests run too: the core
  # is plain Qt and there is no reason for them not to.
  windows:
    name: Windows (compile, test, package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-build

      # Attached to every run, so getting a Windows build is a download rather
      # than a manual dispatch or a spent version number.
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeDial-windows-x86_64
          path: ClaudeDial-windows-x86_64.zip
          retention-days: 30

  # macOS is not in a release and is not a supported tier: the token lives in
  # the Keychain there, so until that is read this build is usable only with
  # CLAUDE_CODE_OAUTH_TOKEN set. Compiled, tested and packaged here anyway,
  # because the alternative is discovering the port has rotted later, and
  # because somebody has a Mac to try it on.
  macos:
    name: macOS (compile, test, package)
    # Not macos-latest, and not by preference. Its Xcode 26 SDK no longer ships
    # AGL - a legacy OpenGL framework Apple removed - while Qt 6.8 still asks
    # the linker for it, so the build dies at `ld: framework 'AGL' not found`.
    # Nothing in ClaudeDial mentions AGL; the reference comes from Qt's own
    # WrapOpenGL.
    #
    # An older image has the framework, and pinning it also lowers the
    # deployment target, which is the right direction for something another
    # person runs. The real fix is a Qt that has stopped referencing AGL, and
    # then this pin can go.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Assemble the bundle
        run: cmake --install build --prefix "$PWD/dist"

      # Printed rather than only asserted, for the same reason as the Windows
      # job: Actions logs need admin rights to read, so a failure would
      # otherwise be diagnosed by guesswork.
      - name: Show what was assembled
        run: |
          find dist -maxdepth 6 | sed "s|^dist||"
          echo '--- the bundle Info.plist, which decides the Dock icon ---'
          cat "$(find dist -name Info.plist -path '*claudedial.app/Contents/Info.plist' -print -quit)" || true

      # Searched across the whole tree rather than at paths chosen in advance.
      # Every guess about this layout has been wrong once: the bundle turned up
      # under bin/, the QML modules outside the bundle, and the name of the TLS
      # plugin on macOS is not something anyone here can check.
      - name: Check what was assembled
        run: |
          fail=0
          need() {
            find dist \( -name "$1" -o -type d -name "$1" \) -print -quit | grep -q . \
              || { echo "MISSING $2 ($1)"; fail=1; }
          }
          need 'claudedial.app'  'the app bundle'
          need 'claudedial'      'the executable'
          need 'QtQuick.framework' 'QtQuick - nothing would render'

          find dist -type d -name Basic -path '*Controls*' -print -quit | grep -q . \
            || { echo 'MISSING QtQuick.Controls.Basic - the settings window will not load'; fail=1; }

          # Any TLS backend plugin, whatever it is called here.
          find dist -name '*backend*.dylib' -print -quit | grep -q . \
            || { echo 'MISSING a TLS backend - api.anthropic.com will be unreachable'; fail=1; }

          plist=$(find dist -name 'Info.plist' -path '*claudedial.app*' -print -quit)
          if [ -n "$plist" ]; then
            grep -q LSUIElement "$plist" \
              || { echo 'MISSING LSUIElement - it would take a Dock icon'; fail=1; }
          else
            echo 'MISSING the bundle Info.plist'; fail=1
          fi
          exit $fail

      - name: Zip it
        run: ditto -c -k --sequesterRsrc --keepParent dist ClaudeDial-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeDial-macos
          path: ClaudeDial-macos.zip
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Arch (newest Qt)"
            container: archlinux:latest
            install: |
              pacman -Syu --noconfirm --needed \
                base-devel cmake ninja git \
                qt6-base qt6-declarative qt6-svg
          - name: "Fedora 41 (near the declared Qt floor)"
            container: fedora:41
            install: |
              dnf -y install \
                gcc-c++ cmake ninja-build git \
                qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
                mesa-libGL-devel

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: ${{ matrix.install }}

      - name: Report the Qt version actually in use
        run: cmake --version && (qmake6 -query QT_VERSION || true)

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The core is deliberately headless-testable: QTEST_GUILESS_MAIN, no
      # QGuiApplication, no display. If this ever needs Xvfb, something has
      # leaked out of core.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Catches the classic packaging failure: a file that builds here because
      # it exists locally but was never committed.
      - name: Install into a staging root
        run: DESTDIR="$PWD/staged" cmake --install build --prefix /usr

      - name: Show what would be packaged
        run: find staged -type f | sort

      # QML resolves properties at run time, so a token removed from Theme.qml
      # leaves a dangling reference that compiles, links, packages and ships.
      # Exactly that happened: theme.warning was removed when the colour ramp
      # moved into C++, Popup.qml kept referencing it, and the "Stale" label
      # rendered with no colour. A warm QML cache hid it locally; only a
      # packaged build with a cold cache showed the error.
      - name: Check every theme token referenced in QML exists
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          theme = pathlib.Path('src/ui/qml/Theme.qml').read_text()
          defined = set(re.findall(r'property (?:color|int|bool) (\w+)', theme)) | {'levelColor'}
          missing = {}
          for f in sorted(pathlib.Path('src/ui/qml').glob('*.qml')):
              if f.name == 'Theme.qml':
                  continue
              used = set(re.findall(r'\btheme\.(\w+)', f.read_text()))
              gap = used - defined
              if gap:
                  missing[f.name] = sorted(gap)
          for name, tokens in missing.items():
              print(f"{name}: references undefined theme tokens {tokens}")
          sys.exit(1 if missing else 0)
          EOF
