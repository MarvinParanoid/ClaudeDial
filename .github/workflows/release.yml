name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Personal-use Windows build. No installer, no signing, no Store: a folder
  # with the binary and everything Qt needs beside it, zipped.
  #
  # This runs on a tag or on a manual dispatch, and a manual run leaves the zip
  # as a run artefact - which is how to get a Windows build without spending a
  # version number. Compilation itself is checked on every push by ci.yml,
  # because nobody working on this has a cross compiler and a broken Windows
  # build would otherwise sit unnoticed until release day.
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCLAUDEDIAL_BUILD_TESTS=OFF
          cmake --build build --config Release

      # windeployqt copies the Qt runtime, the platform plugin and the QML
      # modules next to the binary. --qmldir is not optional: without it the
      # QtQuick modules the popup and the settings window need are left behind
      # and both windows fail to load, which is the Windows shape of the bug
      # that shipped in v0.1.0 on Linux.
      - name: Assemble the runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/src/Release/claudedial.exe dist/ -ErrorAction SilentlyContinue
          if (-not (Test-Path dist/claudedial.exe)) {
            Copy-Item (Get-ChildItem -Recurse -Filter claudedial.exe build | Select-Object -First 1).FullName dist/
          }
          windeployqt --release --qmldir src/ui/qml dist/claudedial.exe

      - name: Check what was assembled
        shell: pwsh
        run: |
          $fail = 0
          foreach ($need in @('Qt6Core.dll','Qt6Gui.dll','Qt6Quick.dll','Qt6Network.dll')) {
            if (-not (Test-Path "dist/$need")) { Write-Host "MISSING $need"; $fail = 1 }
          }
          if (-not (Test-Path 'dist/platforms/qwindows.dll')) {
            Write-Host 'MISSING the windows platform plugin'; $fail = 1
          }
          if (-not (Test-Path 'dist/QtQuick/Controls/Basic')) {
            Write-Host 'MISSING QtQuick.Controls.Basic - the settings window will not load'; $fail = 1
          }
          if (-not (Test-Path 'dist/tls')) {
            Write-Host 'MISSING the TLS backend - api.anthropic.com will be unreachable'; $fail = 1
          }
          Get-ChildItem dist | Select-Object -ExpandProperty Name
          exit $fail

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ClaudeDial-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: claudedial-windows-run-${{ github.run_id }}
          path: ClaudeDial-windows-x86_64.zip
          retention-days: 14

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 22.04, not 24.04, and deliberately: the runner's glibc becomes the
      # floor for everyone who downloads these artefacts. 22.04 is glibc 2.35;
      # 24.04 would raise it to 2.39 and lock out Debian 12 and RHEL 9 users
      # for nothing.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgl-dev libxkbcommon-dev libfuse2 file

      # No GitHub runner has Qt 6.8 in apt - 22.04 is on 6.2, 24.04 on 6.4 -
      # so Qt comes from the official archives. Building the AppImage here also
      # avoids the trap found while validating the recipe locally: on a full KDE
      # desktop the Qt plugin sweeps up third-party plugins from Qt's plugin
      # directory (kimageformats) and fails on their missing dependencies. A
      # clean Qt install has none of them.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      # v0.1.0 shipped xcb-only, and the first attempt to fix it guessed at an
      # aqtinstall module name and failed to install Qt at all. So: look, do not
      # guess. A Qt application does not link its platform plugin, which is why
      # linuxdeploy deployed only xcb even though more was almost certainly
      # sitting right here.
      - name: List the plugins this Qt actually provides
        run: |
          ls "$QT_ROOT_DIR/plugins/platforms/"
          echo "--- wayland-related plugin directories ---"
          for d in "$QT_ROOT_DIR"/plugins/wayland-*; do
            echo "$(basename "$d"): $(ls "$d" 2>/dev/null | tr '\n' ' ')"
          done

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The plain tarball: what claudedial-bin in the AUR consumes. Links
      # against the system Qt, which is safe because Qt 6 keeps ABI
      # compatibility across minor versions.
      - name: Build the tarball
        working-directory: build
        run: cpack -G TGZ

      - name: Fetch linuxdeploy
        run: |
          base=https://github.com/linuxdeploy
          curl -sSLO $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLO $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      # cmake --install already lays down exactly what linuxdeploy expects: the
      # binary, the .desktop entry and the hicolor icon. Verified locally - it
      # needed no -d or -i overrides.
      # Two things the Qt plugin will not work out on its own.
      #
      # The Wayland platform plugin and its companions are only deployed when
      # named: the plugin follows the *binary's* dependencies, and a Qt
      # application does not link its platform plugin.
      #
      # OpenSSL is dlopen'd rather than linked by the Qt from these archives, so
      # the dependency scan cannot see it either. Locally, against a distro Qt
      # that links it, it was bundled automatically - which is exactly why this
      # is asserted below rather than assumed.
      - name: Build the AppImage
        env:
          OUTPUT: ClaudeDial-x86_64.AppImage
          QML_SOURCES_PATHS: src/ui/qml
          EXTRA_PLATFORM_PLUGINS: 'libqwayland-generic.so;libqwayland-egl.so'
          EXTRA_QT_PLUGINS: 'wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration'
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr

          # Copied in before linuxdeploy runs, rather than named through
          # EXTRA_QT_PLUGINS, which produced an empty directory in v0.1.1.
          # linuxdeploy resolves the dependencies of whatever it finds already
          # in the AppDir, so placing them first is the reliable route.
          #
          # This one is not optional: without a client buffer integration
          # QtQuick cannot present a surface, and v0.1.1's popup did not appear
          # at all on a native Wayland session - only under XWayland.
          mkdir -p AppDir/usr/plugins
          for d in "$QT_ROOT_DIR"/plugins/wayland-*; do
            [ -d "$d" ] && cp -r "$d" AppDir/usr/plugins/
          done

          ssl=$(dirname "$(ldconfig -p | awk '/libssl\.so\.3/{print $NF; exit}')")
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --library "$ssl/libssl.so.3" --library "$ssl/libcrypto.so.3" \
            --output appimage

      # --version needs no credentials, no network and no display, which makes
      # it the one thing that can smoke-test a packaged GUI application in CI.
      - name: Check the AppImage runs
        run: |
          chmod +x ClaudeDial-x86_64.AppImage
          ./ClaudeDial-x86_64.AppImage --version
          ./ClaudeDial-x86_64.AppImage --help

      # Assertions, not a report. v0.1.0 shipped without the Wayland plugin and
      # without OpenSSL because these were printed for someone to read rather
      # than checked, and nobody read them. Each of these has already been a
      # real defect once.
      - name: Verify what the AppImage contains
        run: |
          ./ClaudeDial-x86_64.AppImage --appimage-extract > /dev/null
          fail=0

          echo "--- platform plugins ---"
          ls squashfs-root/usr/plugins/platforms/
          for p in libqxcb.so libqwayland-generic.so; do
            [ -f "squashfs-root/usr/plugins/platforms/$p" ] \
              || { echo "MISSING platform plugin: $p"; fail=1; }
          done

          echo "--- OpenSSL (Qt dlopens it, so nothing else will catch this) ---"
          find squashfs-root -name 'libssl.so.3' -o -name 'libcrypto.so.3'
          for l in libssl.so.3 libcrypto.so.3; do
            find squashfs-root -name "$l" | grep -q . \
              || { echo "MISSING library: $l - HTTPS will fail on hosts whose OpenSSL differs"; fail=1; }
          done

          echo "--- Wayland client buffer integration ---"
          ls squashfs-root/usr/plugins/wayland-graphics-integration-client/ 2>/dev/null
          [ -n "$(ls -A squashfs-root/usr/plugins/wayland-graphics-integration-client/ 2>/dev/null)" ] \
            || { echo "MISSING client buffer integration - QtQuick cannot present a surface on Wayland, so the popup will not appear"; fail=1; }

          echo "--- QML runtime (our own QML is in the binary; QtQuick's is not) ---"
          find squashfs-root -maxdepth 5 -type d -name QtQuick
          [ -d squashfs-root/usr/qml/QtQuick/Controls/Basic ] \
            || { echo "MISSING QtQuick.Controls.Basic - the settings window will not load"; fail=1; }

          exit $fail

      - name: Publish
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/claudedial-*-linux-x86_64.tar.gz
            ClaudeDial-x86_64.AppImage
          generate_release_notes: true

      # A manual run builds the same artefacts but has no tag to publish to, so
      # without this they would be discarded. That is what makes it possible to
      # put a branch build on a test machine - a diagnostic, a fix someone needs
      # to try - without spending a version number on it.
      - name: Attach the build to a manual run
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          # Not ref_name: a branch like diagnose/foo contains a slash, and
          # upload-artifact rejects that - after the whole build has run.
          name: claudedial-run-${{ github.run_id }}
          path: |
            build/claudedial-*-linux-x86_64.tar.gz
            ClaudeDial-x86_64.AppImage
          retention-days: 14
