<?xml version="1.0" encoding="UTF-8"?>
<!--
  The ClaudeDial application icon.

  Generated from the canonical gauge geometry in src/core/GaugeGeometry.h, and
  checked against it by a unit test. Do not adjust these numbers by hand: this
  file had been hand-copied once and drifted - its centre sat 7.8% lower and its
  outer edge 5% smaller than every other rendition of the mark, which is exactly
  why the application icon and the popup's mark stopped looking like the same
  thing.

  It is the same dial as the tray icon, the popup header and the notification
  icon: same start and end angles, same outer radius, same stroke fraction. Only
  the content differs - here a needle and no reading, because an identity mark
  must not appear to be reporting a value.

  Terracotta, and monochrome. In blue this sat in a task manager next to VS Code
  looking like one more blue developer tool; in this colour it is picked out
  instantly, and it says which service ClaudeDial reports on without borrowing
  anyone's logo. One colour rather than a coloured needle, because at 16 px a
  second hue is just noise. No backdrop either: a dark tile forces the mark down
  to about 78% to leave padding, costing the legibility that matters most at
  16 px, and on a dark panel it merges into the background while fighting the
  highlight behind an active task.

  This colour is ClaudeDial's identity only. Interactive controls follow the
  user's own Plasma accent, and usage keeps its own neutral -> amber -> orange
  -> red ramp. Neither should borrow this one.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g fill="none" stroke="#d97757" stroke-linecap="butt">
    <path d="M 9.28 45.12 A 26.24 26.24 0 1 1 54.72 45.12" stroke-width="10.88"/>
  </g>
  <g stroke="#d97757" stroke-linecap="round">
    <line x1="32.00" y1="32.00" x2="40.60" y2="16.36" stroke-width="4.80"/>
  </g>
</svg>
